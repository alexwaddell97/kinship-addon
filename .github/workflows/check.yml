# Runs luacheck (settings in .luacheckrc) on every push to main and every
# pull request: syntax errors, and names used that aren't defined anywhere.
# Anything it finds is listed in one annotation on the run's summary page.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install luacheck
        # luacheck's own Linux build: apt's mirrors have been hanging for minutes.
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL --retry 3 -o "$HOME/bin/luacheck" https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
          chmod +x "$HOME/bin/luacheck"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check the code
        run: |
          if ! luacheck . --formatter plain --codes > luacheck.txt; then
            cat luacheck.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' luacheck.txt)
            echo "::error title=luacheck found problems::$msg"
            exit 1
          fi
          echo "No problems found."
