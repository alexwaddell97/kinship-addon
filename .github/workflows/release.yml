# Builds KinshipRP-<version>.zip and publishes it when a version tag is
# pushed (git tag v1.1.0 && git push origin v1.1.0): a GitHub release, and
# CurseForge too once it's set up. The notes are that version's section of
# CHANGELOG.md.
#
# CurseForge needs, under Settings > Secrets and variables > Actions:
#   secret   CF_API_KEY       an API token from your CurseForge account
#   variable CF_PROJECT_ID    the project's ID (on its CurseForge page)
#   variable CF_GAME_VERSION  optional: more game versions to file it under,
#                             comma-separated, each one's name as CurseForge shows
#                             it or its ID. The versions in the .toc files' Interface
#                             lines are filed under on their own (120107 is 12.1.7),
#                             so a new patch only needs its number added to a .toc.
# Without CF_PROJECT_ID the CurseForge step is skipped.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install luacheck
        # luacheck's own Linux build: apt's mirrors have been hanging for minutes.
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL --retry 3 -o "$HOME/bin/luacheck" https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
          chmod +x "$HOME/bin/luacheck"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check the code
        run: |
          if ! luacheck . --formatter plain --codes > "$RUNNER_TEMP/luacheck.txt"; then
            cat "$RUNNER_TEMP/luacheck.txt"
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$RUNNER_TEMP/luacheck.txt")
            echo "::error title=luacheck found problems::$msg"
            exit 1
          fi

      - name: Check the version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          for toc in KinshipRP.toc KinshipRP_Camelot.toc KinshipRP_Mainline.toc; do
            grep -qx "## Version: $v" "$toc" || { echo "::error::$toc isn't at version $v"; exit 1; }
          done
          grep -q "K.VERSION = \"$v\"" Core/Comm.lua || { echo "::error::Core/Comm.lua isn't at version $v"; exit 1; }
          grep -qx "## $v" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }

      - name: Build the zip
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p build/KinshipRP
          rsync -a --exclude='.git*' --exclude='.github' --exclude='.luacheckrc' --exclude='build' ./ build/KinshipRP/
          cd build && zip -qr "KinshipRP-$v.zip" KinshipRP

      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v head="## $v" '$0 == head { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > changelog.md
          cp changelog.md notes.md
          printf '\n---\nUnzip into your game'"'"'s `Interface\\AddOns` folder (`_forever_` or `_retail_`), so you have an `AddOns\\KinshipRP` folder.\n' >> notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: Kinship RP ${{ github.ref_name }}
          body_path: notes.md
          files: build/KinshipRP-*.zip

      - name: Upload to CurseForge
        if: ${{ vars.CF_PROJECT_ID != '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          api="https://wow.curseforge.com/api"
          [ -n "$CF_API_KEY" ] || { echo "::error::Add the CF_API_KEY secret (an API token from your CurseForge account)."; exit 1; }
          versions=$(curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" "$api/game/versions")
          ids="[]"

          # The versions the .toc files are for: Interface 120107 is 12.1.7.
          # One CurseForge doesn't list yet is skipped with a warning.
          tocs=$(sed -n 's/^## Interface://p' *.toc | tr ',' '\n' | tr -d ' \r' | grep -E '^[0-9]+$' \
            | awk '{ printf "%d.%d.%d\n", int($1 / 10000), int($1 / 100) % 100, $1 % 100 }' | sort -u)
          for name in $tocs; do
            found=$(echo "$versions" | jq -c --arg n "$name" '[.[] | select(.name == $n) | .id]')
            if [ "$found" = "[]" ]; then
              echo "::warning::CurseForge has no game version called $name yet, so this release isn't filed under it."
            else
              echo "Filing under $name (from the .toc files)."
              ids=$(jq -cn --argjson a "$ids" --argjson b "$found" '$a + $b | unique')
            fi
          done

          # Any more named in CF_GAME_VERSION, comma-separated: IDs as given, names looked up
          missing=""
          IFS=',' read -ra wanted <<< "$CF_GAME_VERSION"
          for item in "${wanted[@]}"; do
            item=$(echo "$item" | sed 's/^ *//; s/ *$//')
            [ -n "$item" ] || continue
            if echo "$item" | grep -qE '^[0-9]+$'; then
              found="[$item]"
            else
              found=$(echo "$versions" | jq -c --arg n "$item" '[.[] | select(.name == $n) | .id]')
              [ "$found" = "[]" ] && missing="$missing \"$item\""
            fi
            ids=$(jq -cn --argjson a "$ids" --argjson b "$found" '$a + $b | unique')
          done
          if [ -n "$missing" ]; then
            echo "::error::CurseForge has no game version called$missing (from CF_GAME_VERSION). The names it knows are listed below."
            echo "::group::CurseForge game versions (name, then ID)"
            echo "$versions" | jq -r '.[] | "\(.name)  \(.id)"' | sort -u
            echo "::endgroup::"
            exit 1
          fi
          [ "$ids" != "[]" ] || { echo "::error::None of the game versions in the .toc files or CF_GAME_VERSION are on CurseForge."; exit 1; }

          meta=$(jq -n --rawfile cl changelog.md --arg name "Kinship RP $v" --argjson gv "$ids" \
            '{changelog: $cl, changelogType: "markdown", displayName: $name, gameVersions: $gv, releaseType: "release"}')
          # --form-string sends the details as they are: with -F, a ";" in the
          # notes would cut the JSON short
          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" \
            --form-string "metadata=$meta" -F "file=@build/KinshipRP-$v.zip" \
            "$api/projects/$CF_PROJECT_ID/upload-file"
          echo
          echo "Uploaded Kinship RP $v to CurseForge."
